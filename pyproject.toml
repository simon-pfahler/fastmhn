[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmhn"
authors = [
    {name = "Simon Pfahler", email = "simon.pfahler@ur.de"}
]
description = "Fast inference of MHN models"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "mhn",
    "joblib"
]
version = "1.0.0"

[project.urls]
repository = "https://phygit.ur.de/physics/mhn/fastmhn"
homepage = "https://phygit.ur.de/physics/mhn/fastmhn"
